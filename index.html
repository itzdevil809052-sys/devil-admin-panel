<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bobby Admin Panel</title><style>body{font-family:Arial;margin:0;background:#f3f4f6;color:#111827}header{background:#111827;color:white;padding:16px;display:flex;justify-content:space-between}nav{padding:12px;background:white;display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}.on{background:#2563eb;color:white}.box{background:white;margin:16px;padding:18px;border-radius:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:18px;background:white;border-radius:12px}.num{font-size:28px;font-weight:bold}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}}</style><header><b>🛠️ Bobby Admin</b><button onclick="logout()">Logout</button></header><nav><button onclick="show('Dashboard')">📊 Dashboard</button><button onclick="show('Users')">👥 Users</button><button onclick="show('Games')">🎮 Games</button><button onclick="show('Banners')">🖼️ Banners</button><button onclick="show('Settings')">⚙️ Settings</button></nav><main id="app"></main><script>
let users=2,games=1,banners=1;
function show(p){let x='';if(p==='Dashboard')x='<h2>Dashboard</h2><div class="cards"><div class="card">Users<div class="num">'+users+'</div></div><div class="card">Games<div class="num">'+games+'</div></div><div class="card">Banners<div class="num">'+banners+'</div></div><div class="card">Server<div class="num">Demo</div></div></div><div class="box">Panel frontend चल रहा है। अभी असली API/Database जुड़ा नहीं है।</div>';if(p==='Users')x='<h2>Users</h2><div class="box"><button onclick="users++;show(\'Users\')">+ User जोड़ें</button><p>कुल Users: '+users+'</p></div>';if(p==='Games')x='<h2>Games</h2><div class="box"><button onclick="games++;show(\'Games\')">+ Game जोड़ें</button><p>कुल Games: '+games+'</p></div>';if(p==='Banners')x='<h2>Banners</h2><div class="box"><button onclick="banners++;show(\'Banners\')">+ Banner जोड़ें</button><p>कुल Banners: '+banners+'</p></div>';if(p==='Settings')x='<h2>Settings</h2><div class="box"><label>API URL</label><br><input id="api" style="width:90%;padding:10px" value="https://api.example.com/api"><br><br><button onclick="alert(\'सेटिंग सेव हो गई\')">Save</button></div>';document.getElementById('app').innerHTML=x}function logout(){alert('Demo logout')}show('Dashboard');
</script></html>
